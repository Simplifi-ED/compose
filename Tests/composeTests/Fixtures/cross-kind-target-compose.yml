configs:
  app_config:
    file: ./secrets/app_config.txt
secrets:
  db_password:
    file: ./secrets/db_password.txt
services:
  app:
    image: docker.io/library/alpine:3.20
    configs:
      - source: app_config
        target: /run/shared/mount
    secrets:
      - source: db_password
        target: /run/shared/mount
