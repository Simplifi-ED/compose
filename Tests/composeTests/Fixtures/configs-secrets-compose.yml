configs:
  app_config:
    file: ./secrets/app_config.txt
secrets:
  db_password:
    file: ./secrets/db_password.txt
services:
  app:
    image: docker.io/library/alpine:3.24
    command: ["sh", "-c", "cat /run/configs/app_config /run/secrets/db_password"]
    configs:
      - app_config
    secrets:
      - source: db_password
        target: /run/secrets/db_password
