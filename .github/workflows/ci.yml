name: Compose CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          for app in /Applications/Xcode_26*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcrun swift --version

      - name: Install SwiftLint
        run: ./scripts/install-swiftlint.sh

      - name: Lint Source Code
        run: make lint

      - name: Build Debug (Strict Warnings)
        run: make build BUILD_CONFIGURATION=debug WARNINGS_AS_ERRORS=true

      - name: Run Integration Checks
        run: make test

      - name: Verify Release Build
        run: |
          ./scripts/build-release.sh
          file dist/compose/bin/compose | grep -q arm64
          codesign -v dist/compose/bin/compose
          codesign -dvvv dist/compose/bin/compose

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          for app in /Applications/Xcode_26*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcrun swift --version

      - name: Install container CLI
        run: brew install --cask container

      - name: Run Smoke Test
        env:
          SKIP_KERNEL_CHECK: "1"
        run: ./scripts/smoke-test.sh
