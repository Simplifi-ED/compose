name: Compose CI

# Maintainer quality gate — run manually from Actions → Compose CI → Run workflow.
# Release tags still validate via .github/workflows/release.yml.
on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run live container smoke test (installs container via Homebrew)
        type: boolean
        default: false

concurrency:
  group: compose-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          for app in /Applications/Xcode_26*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcrun swift --version

      - name: Install SwiftLint
        run: ./scripts/install-swiftlint.sh

      - name: Lint Source Code
        run: make lint

      - name: Build Debug (Strict Warnings)
        run: make build BUILD_CONFIGURATION=debug WARNINGS_AS_ERRORS=true

      - name: Run Integration Checks
        run: make test

      - name: Verify Release Build
        run: |
          make verify-codesign
          file dist/compose/bin/compose | grep -q arm64

  smoke:
    if: github.event.inputs.run_smoke == 'true'
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          for app in /Applications/Xcode_26*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcrun swift --version

      - name: Install container CLI
        run: brew install --cask container

      - name: Run Smoke Test
        env:
          SKIP_KERNEL_CHECK: "1"
        run: ./scripts/smoke-test.sh
