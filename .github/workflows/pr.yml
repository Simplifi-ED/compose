name: Compose PR

# Untrusted fork PRs: read-only token, no secrets, no write permissions.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: compose-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          for app in /Applications/Xcode_26*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcrun swift --version

      - name: Install SwiftLint
        run: ./scripts/install-swiftlint.sh

      - name: Lint Source Code
        run: make lint

      - name: Build Debug (Strict Warnings)
        run: make build BUILD_CONFIGURATION=debug WARNINGS_AS_ERRORS=true

      - name: Run Integration Checks
        run: make test

      - name: Verify Release Codesign
        run: make verify-codesign
