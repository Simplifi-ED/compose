name: Compose Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          for app in /Applications/Xcode_26*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcrun swift --version

      - name: Install SwiftLint
        run: ./scripts/install-swiftlint.sh

      - name: Lint Source Code
        run: make lint

      - name: Build Release (Strict Warnings)
        run: make build BUILD_CONFIGURATION=release WARNINGS_AS_ERRORS=true

      - name: Run Integration Checks
        run: make test

      - name: Package Release Artifacts
        run: make dist

      - name: Verify Release Codesign
        run: ./scripts/verify-codesign.sh dist/compose/bin/compose entitlements.plist

      - name: Write SHA256 Checksums
        run: |
          shasum -a 256 dist/compose-plugin.tar.gz | awk '{print $1}' > dist/compose-plugin.tar.gz.sha256
          shasum -a 256 dist/container-compose-macos-arm64.zip | awk '{print $1}' > dist/container-compose-macos-arm64.zip.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ASSETS=(
            dist/compose-plugin.tar.gz
            dist/compose-plugin.tar.gz.sha256
            dist/container-compose-macos-arm64.zip
            dist/container-compose-macos-arm64.zip.sha256
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

  bump-homebrew-formula:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Simplifi-ED/homebrew-compose
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Update container-compose Formula
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          URL="https://github.com/${REPO}/releases/download/${TAG}/compose-plugin.tar.gz"
          SHA256="$(curl --retry 6 --retry-all-errors --retry-delay 2 --retry-connrefused -fsSL "$URL" | shasum -a 256 | awk '{print $1}')"
          if [ -z "$SHA256" ]; then
            echo "error: failed to compute SHA256 for ${URL}" >&2
            exit 1
          fi
          FORMULA="Formula/container-compose.rb"
          sed -i "s|version \".*\"|version \"${VERSION}\"|" "$FORMULA"
          sed -i "s|url \".*\"|url \"${URL}\"|" "$FORMULA"
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" "$FORMULA"
          grep -Fq "version \"${VERSION}\"" "$FORMULA"
          grep -Fq "$URL" "$FORMULA"
          grep -Fq "$SHA256" "$FORMULA"

      - name: Push formula bump to tap main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/container-compose.rb
          if git diff --staged --quiet; then
            echo "Formula already at ${TAG}"
            exit 0
          fi
          git commit -m "container-compose ${TAG}"
          git push origin HEAD:main
