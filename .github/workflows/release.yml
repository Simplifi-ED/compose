name: Compose Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          for app in /Applications/Xcode_26*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcrun swift --version

      - name: Install SwiftLint
        run: ./scripts/install-swiftlint.sh

      - name: Lint Source Code
        run: make lint

      - name: Build Debug (Strict Warnings)
        run: make build BUILD_CONFIGURATION=debug WARNINGS_AS_ERRORS=true

      - name: Run Integration Checks
        run: make test

      - name: Build Release Package
        run: make dist

      - name: Write SHA256 Checksum
        run: shasum -a 256 dist/compose-plugin.tar.gz | awk '{print $1}' > dist/compose-plugin.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/compose-plugin.tar.gz
            dist/compose-plugin.tar.gz.sha256
          generate_release_notes: true

  bump-homebrew-formula:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Default Branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update container-compose Formula
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://github.com/${REPO}/releases/download/${TAG}/compose-plugin.tar.gz"
          curl -fsSL "$URL" -o compose-plugin.tar.gz
          SHA256="$(shasum -a 256 compose-plugin.tar.gz | awk '{print $1}')"
          FORMULA="Formula/container-compose.rb"
          sed -i "s|url \".*\"|url \"${URL}\"|" "$FORMULA"
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" "$FORMULA"

      - name: Open Formula Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bump-container-compose-${{ github.ref_name }}
          title: container-compose ${{ github.ref_name }}
          commit-message: container-compose ${{ github.ref_name }}
          body: |
            Automated bump for [${{ github.ref_name }}](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}).
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true
